title: "Add group state type and startup validation for workflow nesting"
intent: |
  ## Overview

  Add a new `group` state type that enables sub-workflows to be embedded within a main workflow.
  This ticket focuses on type definitions and fail-fast validation rules to ensure sub-workflows
  are well-formed and nesting constraints are enforced.

  ## Scope

  1. **Update `types.ts`:**
     - Add `GroupStateConfig` interface with required `group` field (relative path to sub-workflow YAML)
     - Update `StateType` union to include `'group'`
     - Update `StateConfig` union to include `GroupStateConfig`

  2. **Update `workflow/schemas.ts`:**
     - Add schema definition for group state (required: `type`, `group`; optional: `skip`, `approval`, `on`, `transitions`, `max_visits`, `notify`, `reset_outputs`, `output`, `feedback`)

  3. **Add validation rules in `registry/registryValidator.ts`:**
     - **Rule 1:** Sub-workflow file must exist relative to main workflow directory
     - **Rule 2:** Sub-workflow cannot declare any `group` states (depth limit = 1 only)
     - **Rule 3:** Main workflow cannot directly reference sub-workflow state IDs in transitions
     - **Rule 4:** Sub-workflow must have at least one state with `out: true` to be a valid group

  ## Fail-fast behavior

  All validation errors must throw immediately at startup before any execution begins.

  ## Acceptance criteria

  - [ ] `group` states parse and validate without errors
  - [ ] Nesting violations caught at startup (fail-fast)
  - [ ] Unit test: load sub-workflow with group state → validation error
  - [ ] Unit test: missing sub-workflow file → validation error
  - [ ] Unit test: sub-workflow state referenced in main transitions → validation error
  - [ ] Unit test: sub-workflow with no `out: true` state → validation error

