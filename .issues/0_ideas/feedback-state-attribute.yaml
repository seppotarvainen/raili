title: "Add feedback attribute for capturing free-form user input as a workflow variable"
intent: |
  ## Overview

  Add a `feedback:` block as an optional attribute on any state type (engine, agent, script, command).
  It pauses execution after the state completes, prompts the user for free-form text input, stores
  the value as a workflow variable (persisted in context.json), and exposes it as `RAILI_VAR_<NAME>`
  for use in downstream states — without affecting routing.

  ## Motivation

  The existing `approval:` block only handles binary yes/no routing. There is no way to collect
  a free-form string (e.g. a commit message, a review note, a rejection reason) and pass it to
  subsequent states. `feedback:` fills this gap as a data-capture-only primitive.

  ## YAML syntax

  ```yaml
  check_done:
    type: engine
    approval:
      question: "Do you want to commit?"
      PASSED: move_to_done
      FAILED: code
    feedback:
      question: "Commit message"
      expose_var: commit_message   # required
      required: true               # optional; re-prompts if user submits empty string
      multiline: false             # optional; default false

  commit_changes:
    type: command
    command: git commit -m "$RAILI_VAR_COMMIT_MESSAGE"
  ```

  ## Behaviour specification

  - `feedback:` fires **after** the state has executed and **after** `approval:` (if present),
    regardless of the approval outcome (PASSED or FAILED).
  - The captured value is stored in `context.json` under the workflow vars immediately after input.
  - The value is exported as `RAILI_VAR_<UPPERCASE_VAR_NAME>` for shell commands and scripts.
  - The value participates in `${VAR_NAME}` interpolation in agent prompts and commands exactly
    like other workflow vars.
  - If `required: true` and the user submits an empty string, the prompt is shown again (loop).
  - If `required` is absent or false, an empty string is accepted and stored as-is.
  - If the run is resumed and the state was already fully completed (feedback captured), the stored
    value is reused — the prompt is not shown again.

  ## Fail-fast validation

  - `expose_var` is mandatory; missing it is a startup error.
  - If `expose_var` collides with any declared workflow `inputs` name, `registryValidator` throws
    immediately before execution starts.

  ## CI / test override

  - Automated tests (and CI) can bypass stdin by setting the env var
    `RAILI_FEEDBACK_<UPPERCASE_VAR_NAME>=<value>` before running. This mirrors how
    `RAILI_MANUAL_CHOICE` works for `approval:`.

  ## Acceptance criteria

  - [ ] `feedback:` is accepted on any state type alongside other optional blocks (`notify`, `output`, `approval`, etc.)
  - [ ] Input is collected after state execution, after `approval` (if both present)
  - [ ] Value is persisted to `context.json` and survives resume
  - [ ] Value is available as `${expose_var}` in prompts and `RAILI_VAR_<NAME>` in commands
  - [ ] `required: true` re-prompts on empty input
  - [ ] `expose_var` name collision with inputs causes fail-fast startup error
  - [ ] `RAILI_FEEDBACK_<NAME>` env var overrides stdin (enables automated testing)
  - [ ] `multiline: true` option supported for multi-line text input
  - [ ] Unit tests cover: happy path, required re-prompt, empty-allowed, CI override, collision error
  - [ ] Integration test covers end-to-end: feedback captured → variable used in downstream command

  ## Out of scope

  - Feedback does NOT affect routing (no PASSED/FAILED branching)
  - Feedback is NOT a replacement for `approval:` — they are composable but independent
  - No support for validation beyond empty-check (regex, length limits, etc.) in this iteration

