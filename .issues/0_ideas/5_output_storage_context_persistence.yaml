title: "Ensure flattened state machine outputs and context persist correctly"
intent: |
  ## Overview

  Implement output storage and context persistence for group workflows. Outputs and learnings
  from all states (parent and sub-workflow) are stored in a shared directory. The state history
  is fully flattened and resumable from any state, including sub-workflow states.

  ## Scope

  1. **Update `context/outputStore.ts`:**
     - Confirm outputs are stored per-state in `.raili/<workflow>/outputs/<stateId>.md`
     - Sub-workflow state outputs go to same directory (not a sub-folder)

  2. **Update `context/learningStore.ts`:**
     - Confirm learnings stored in `.raili/<workflow>/learnings/` (no sub-workflow grouping)

  3. **Update `context/context.ts`:**
     - Ensure state history entries include both parent and sub-workflow states in order
     - On resume, all states (parent + sub-workflow) are available for context loading

  4. **Update `Runner.ts` (resume logic):**
     - When resuming, the flattened state machine has no notion of "which sub-workflow was active"
     - All state entries are sequential in history → resume works transparently

  ## Persistence behavior

  - Outputs are stored in shared directory (no sub-workflow separation)
  - Learnings are stored in shared directory (no sub-workflow separation)
  - State history is flattened and sequential
  - `max_visits` on group state is counted per entry (not per sub-workflow internal loops)
  - Resume from mid-sub-workflow continues from the exact sub-workflow state

  ## Acceptance criteria

  - [ ] Outputs and learnings stored in shared directory (no sub-workflow separation)
  - [ ] Context persists flattened state history (resumable from any sub-workflow state)
  - [ ] `max_visits` on group state counted per entry (not per sub-workflow internal loops)
  - [ ] Integration test: run main → group → sub-workflow states → check `.raili/main/outputs/` contains all state outputs (parent + sub)
  - [ ] Integration test: stop mid-sub-workflow, resume → continues from correct sub-workflow state
  - [ ] Integration test: sub-workflow state with learnings → persisted to `.raili/main/learnings/`
  - [ ] Unit test: context.json stateHistory includes flattened list of all state entries

