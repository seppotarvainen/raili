title: LSP (Language Server Protocol) for Raili workflows
intent: |
    # Language Server Protocol for Raili Workflows

    ## Overview
    Build a Language Server Protocol (LSP) server for Raili workflow.yaml files, enabling rich IDE support 
    (goto definition, find references, hover, diagnostics, rename) across multiple editors. 
    Start with IntelliJ support; architecture supports other LSP clients (VS Code, Neovim, etc.) in future.

    LSP runs as separate npm package (`@raili/lsp`) in same monorepo with strict separation: 
    LSP may import Raili types/schemas as npm dependency, but CLI and LSP never import each other directly.

    ## Motivation
    Workflow.yaml files are state machines with complex routing. Users need IDE navigation similar to code:
    - **Goto Definition**: Cmd+Click on state name → jump to state declaration
    - **Find References**: Find all places where a state is referenced
    - **Hover**: See state type, routing, description
    - **Rename**: Safely rename a state and update all references
    - **Diagnostics**: Real-time validation errors (undefined states, unreachable states, etc.)

    This bridges the gap between workflow-as-config and workflow-as-code mental model.

    ## Design Model

    ### Single-File Scope (v1)
    LSP operates on a single opened `workflow.yaml` file. No cross-file navigation yet:
    - References to states in the current file only
    - Groups/embeds are not resolved (e.g., jumping to `group: ./test-group.yaml` is out of scope)
    - Future: support group/embed cross-file navigation in v2

    ### Definitions & References
    **State Definition**: The `states:` map key declaration
    ```yaml
    states:
      code:          # ← definition (line 80, column 7)
        type: agent
    ```

    **State References**: Used in routing contexts only:
    - `on: {PASSED: code, FAILED: error}`
    - `transitions: {approve: code, reject: error}`
    - `approval: {PASSED: code, FAILED: error}`
    - `continue: code`
    - `skip: code`
    - `reset_outputs: [code, test]`
    - `reset_max_visits: [code, build]`
    - `map: {done: {PASSED: code}}` (for embedded/group terminal states)

    **NOT references**: State names in strings (e.g., `command: npm run build` or `prompt: "Deploy code"`).

    ### Core LSP Features

    #### 1. Goto Definition (`textDocument/definition`)
    User Cmd+Clicks on state reference → jumps to its declaration.
    - Input: position in text (e.g., `code` in `on: {PASSED: code}`)
    - Output: location of state declaration (`states: { code: ... }`)
    - Single target (if not found, return null)

    #### 2. Find References (`textDocument/references`)
    User requests all usages of a state.
    - Input: position of state reference or definition
    - Output: list of locations where state is used in routing
    - Includes definition + all references

    #### 3. Hover (`textDocument/hover`)
    User hovers over a state name → shows metadata.
    - Input: position in text
    - Output: markdown hover card with:
      - State type (`agent`, `script`, `command`, `engine`, `group`, `embed`)
      - Routing (`on:`, `transitions:`, `approval:`, `continue:`, `skip:`)
      - Key properties (max_visits, output, notify, etc.)

    #### 4. Diagnostics (`textDocument/publishDiagnostics`)
    Real-time validation errors/warnings after each edit.
    - Undefined states in references (e.g., `on: {PASSED: unknown_state}`)
    - Unreachable states (e.g., state with no incoming transitions, not initial)
    - Unused states (no incoming transitions, not initial, not terminal)
    - Duplicate state IDs
    - Invalid routing (e.g., `transitions:` without state output)
    - Missing `initial:` state
    - Initial state doesn't exist
    - Suggestion: warn if state has no routing (truly terminal)? → No, terminals are intentional & common

    #### 5. Rename Symbol (`textDocument/rename`)
    User renames a state → updates all references (routing only).
    - Input: state name, new name
    - Output: list of edits in the file
    - Renames: state definition + all state references in routing contexts
    - Does NOT rename strings in commands/scripts/prompts (runtime concern)

    ### Hover Information Structure
    ```markdown
    **code** (agent state)

    Type: agent
    Agent: raili-coding
    Max visits: 8

    **Routing**: transitions {approve → complete_part, revise → code}

    **Output**: stored, marker: //SUMMARY//, use_latest: 3

    **Notify**: [before entry]

    **Teach**: raili-coding (feedback learning)
    ```

    ### Diagnostics Examples
    ```yaml
    states:
      code:
        on:
          PASSED: unknown_state  # ← ERROR: State 'unknown_state' not found
          FAILED: exit
      
      unused_state:              # ← WARNING: State 'unused_state' is unreachable
        type: engine
        on:
          PASSED: done
      
      done:
        type: engine
        # ← Terminal state (no warning, intentional)
    ```

    ## Architecture

    ### Package Structure
    ```
    raili/
      package.json                       # root (version 1.2.3)
      tsconfig.json
      src/
        cli.ts
        types.ts                         # ← exported as @raili, imported by LSP
        runner/
        ...
      packages/
        lsp/
          package.json                   # @raili/lsp, same version (1.2.3)
          tsconfig.json                  # LSP-specific TS config
          src/
            server.ts                    # LSP server entry point
            protocol/
              protocol.ts                # Goto def, find refs, hover, diagnostics, rename
              definition.ts
              references.ts
              hover.ts
              diagnostics.ts
              rename.ts
            parser/
              workflowParser.ts          # Parse workflow.yaml → state definitions + references
            validator/
              workflowValidator.ts       # Validation rules (undefined states, unreachable, etc.)
            index.ts                     # Export public API
          __tests__/
            server.test.ts
            protocol.test.ts
            parser.test.ts
            validator.test.ts
          bin/
            lsp.js                       # Executable: `raili-lsp --stdio`
    ```

    ### Version Sync
    - LSP lives in separate npm package (`@raili/lsp`) but same monorepo
    - Root `package.json` version is the source of truth (e.g., `1.2.3`)
    - `packages/lsp/package.json` version always matches root version
    - CI/CD publishes both as same version tag: `raili@1.2.3` + `@raili/lsp@1.2.3`
    - Users install: `npm i -g @raili/lsp@1.2.3` (same version as `raili` CLI)
    - LSP schema validation is always in sync with runner behavior

    ### Entry Point
    User installs: `npm install -g @raili/lsp`
    IntelliJ runs: `raili-lsp --stdio`
    LSP accepts workflow.yaml files via `textDocument/didOpen` messages.

    ### Monorepo Build & Test
    Root-level scripts handle both CLI and LSP:
    ```json
    {
      "scripts": {
        "build": "npm run build:cli && npm run build:lsp",
        "build:cli": "tsc",
        "build:lsp": "cd packages/lsp && tsc",
        "test": "jest --runInBand && cd packages/lsp && jest --runInBand",
        "test:lsp": "cd packages/lsp && jest --runInBand"
      }
    }
    ```
    - LSP has own `tsconfig.json` for separate compilation
    - LSP has own `jest.config.js` (or inherits root config)
    - Separate test runs for CI/CD (can run `npm run test:lsp` independently)

    ### Dependencies
    - `vscode-languageserver` — LSP protocol implementation
    - `vscode-languageserver-textdocument` — text synchronization
    - `js-yaml` — parse workflow.yaml (already in Raili)
    - `@raili` (main package) — import types & schemas (optional, for type safety)

    **Constraint**: LSP does NOT import from Raili CLI code (`src/cli`, `src/runner`, etc.). 
    Only types/schemas if needed. Raili CLI never imports from LSP.

    ### Parser Strategy
    No full AST — lightweight document model:
    - Track state definitions (name, line, column, type)
    - Track state references (name, line, column, context: `on`/`transitions`/`approval`/etc.)
    - YAML structure parsing via `js-yaml`, position tracking via line/column offset

    ### Diagnostic Rules
    ```typescript
    function validateWorkflow(doc: WorkflowDocument): Diagnostic[] {
      const errors = [];
      const states = doc.states;
      const initialState = doc.initial;
      const references = doc.stateReferences();

      // Rule 1: Initial state must exist
      if (initialState && !states.has(initialState)) {
        errors.push(diagnostic(SEVERITY.ERROR, `State '${initialState}' not found`));
      }

      // Rule 2: All referenced states must exist
      for (const ref of references) {
        if (!states.has(ref.name)) {
          errors.push(diagnostic(ref.location, SEVERITY.ERROR, `State '${ref.name}' not found`));
        }
      }

      // Rule 3: Unreachable states
      const reachable = new Set([initialState]);
      // ... traverse routing to mark reachable states
      for (const state of states.keys()) {
        if (!reachable.has(state)) {
          errors.push(diagnostic(state.location, SEVERITY.WARNING, `State '${state}' is unreachable`));
        }
      }

      // ... more rules

      return errors;
    }
    ```

    ## MVP Acceptance Criteria
    - [ ] LSP server runs as `@raili/lsp` package
    - [ ] `raili-lsp --stdio` binary works (can be invoked by IDE)
    - [ ] Goto Definition (`textDocument/definition`): jump to state declaration
    - [ ] Find References (`textDocument/references`): list all usages
    - [ ] Hover (`textDocument/hover`): show state metadata (type, routing, properties)
    - [ ] Diagnostics (`textDocument/publishDiagnostics`): validate on every edit
      - Undefined states in references
      - Unreachable states
      - Unused states
      - Duplicate state IDs
      - Missing/invalid `initial:`
    - [ ] Rename Symbol (`textDocument/rename`): safely rename state + update all references
    - [ ] Unit tests for parser, validator, protocol handlers
    - [ ] No direct imports between Raili CLI and LSP (separation of concerns)
    - [ ] IntelliJ plugin configuration (separate ticket: how IntelliJ invokes LSP server)

    ## Implementation Notes

    ### Position Tracking
    YAML lacks built-in position tracking. Use `js-yaml` + custom tracking:
    - Track line/column for each state definition and reference
    - Build a position map during parse: `Map<line:column, {type: 'def'|'ref', name, context}>`

    ### Limitation: No AST
    LSP uses line/column offsets + regex for reference matching, not true AST. 
    This is sufficient for single-file v1 but would need refactoring for cross-file support.

    ### Testing
    - Unit tests mock `WorkflowDocument` and test each diagnostic rule
    - Unit tests mock LSP protocol handlers
    - Integration tests: parse real workflow.yaml files, validate diagnostics

    ## Future Enhancements (v2+)
    - Cross-file navigation (groups, embeds, registries)
    - Code completion/autocomplete (suggest state names, agent IDs, script names)
    - Code formatting (workflow.yaml formatter)
    - VS Code/Neovim clients
    - Workflow visualization (state diagram export)

    ## Out of Scope (v1)
    - Variable interpolation validation
    - Cross-file references
    - Group/embed resolution
    - IntelliJ plugin implementation (separate ticket)

    ## Notes for Designer
    - LSP is **lazy**: loads workflow.yaml on first `textDocument/didOpen`
    - LSP is **stateless per file**: no caching between requests (simpler, stateless design)
    - Diagnostics published on every `textDocument/didChange` (real-time feedback)
    - Rename is scope-safe: updates only state references in routing, not arbitrary strings


