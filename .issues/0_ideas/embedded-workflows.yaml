title: Embedded workflows with independent context and parent-controlled routing
intent: |
    # Embedded Workflows Feature

    ## Overview
    Enable workflows to embed other complete workflows as reusable sub-workflows (similar to `groups`), 
    but with independent context isolation and explicit parent-controlled routing of terminal states.

    This allows code reuse across workflows (e.g., `server` workflow reusing most of `main` workflow) 
    while maintaining clean separation and explicit routing control in the parent.

    ## Motivation
    Currently, `main` and `server` workflows are nearly identical except for Trello integration points.
    Embedded workflows allow `server` to embed `main` as a sub-workflow, with pre/post hooks for 
    Trello card movement (`move_card_todo`, `move_card_doing`, `move_card_done`).

    Future enhancement: `pre_states` hooks could run before specific child states (e.g., move Trello card before `code` begins).

    ## Design Model

    ### State Type: `embed`
    New state type `type: embed` embeds a complete workflow as a sub-workflow.

    ```yaml
    parent_workflow:
      initial: init
      states:
        run_main:
          type: embed
          embed: ./main/workflow.yaml
          map:
            done: deploy
            exit: handle_failure
        deploy:
          type: agent
          agent: deployer
    ```

    ### Context Isolation
    - Child workflow's context is stored inside parent's `.raili/<parent>/context.json`
    - All child state entries, outputs, and learnings are stored under parent's directory
    - Child workflow is NOT resumable independently
    - Only parent controls workflow resumption

    ### State ID Prefixing
    - Child states are prefixed with `<embedStateId>.` (dot separator), e.g., `run_main.code`, `run_main.review`
    - Fail-fast validation: state ID collisions between parent and prefixed child states throw error
    - Example: If parent has state `main` and child workflow has `code` state, the prefixed state is `main.code`

    ### Terminal States and Routing (`map:`)
    - Child workflow's top-level terminal states are listed in parent's `map:` section
    - Each terminal state maps to one or more parent states via standard routing (`on:`, `transitions:`, `approval:`)
    - If a terminal state is NOT mapped, the parent workflow becomes terminal (execution stops)
    - Terminal states in the child are "exit points" — not revisitable via parent routing
    - Example:
      ```yaml
      run_main:
        type: embed
        embed: ./workflows/main.yaml
        map:
          done:           # Child terminal state "run_main.done"
            on:
              PASSED: deploy
              FAILED: rollback
          exit:           # Child terminal state "run_main.exit"
            on:
              FAILED: notify_team
      ```

    ### Variables and Inputs
    - Child workflow declares its own `inputs:` in its workflow.yaml
    - Parent and child inputs are merged (like groups)
    - On name conflict, parent wins (parent's value takes precedence)
    - Variables are shared in flat context (e.g., `${id}`, `${title}` available in both parent and child)
    - Variable interpolation in child prompts/commands follows same rules as groups

    ### Output Storage
    - Child states save outputs to `.raili/<parent>/outputs/<prefixed_state_id>.md`
    - Example: child state `code` saves to `.raili/parent/outputs/run_main.code.md`
    - Child learnings saved to `.raili/<parent>/learnings/<child_agent_id>.md` (shared per agent)

    ### Validation (Fail-Fast)
    - Embed file must exist (fail: `Embedded workflow not found: <path>`)
    - Embedded workflow must not declare `initial:` (first state in `states:` is entry point)
    - Embedded workflow must declare at least one top-level terminal state (fail: `Embedded workflow must declare at least one terminal state`)
    - No nested `embed` states in child workflow (depth limit = 1, fail: `Embedded workflow must not contain 'embed' states`)
    - State ID collision detection (fail: `State id collision when embedding`)
    - Duplicate input keys with parent (fail: `Duplicate input key`)
    - Child terminal states must not define own routing (fail: `Terminal states in embedded workflow must not define routing`)
    - `map:` must reference only child terminal states (fail: `Non-terminal state '<state>' in map:`)

    ## Example Workflow

    ### Parent: `server` workflow
    ```yaml
    initial: init
    inputs:
      - name: title
      - name: intent
      - name: card_id

    states:
      init:
        type: engine
        on:
          PASSED: move_card_todo

      move_card_todo:
        type: command
        command: node .raili/server/move_card_in_trello.js $RAILI_VAR_CARD_ID "Todo"
        on:
          PASSED: run_main_workflow
          FAILED: exit

      run_main_workflow:
        type: embed
        embed: ./main.yaml
        map:
          done:
            on:
              PASSED: move_card_done
              FAILED: exit
          exit:
            on:
              FAILED: exit

      move_card_done:
        type: command
        command: node .raili/server/move_card_in_trello.js $RAILI_VAR_CARD_ID "Done"
        on:
          PASSED: success
          FAILED: exit

      success:
        type: engine
        success: true

      exit:
        type: engine
        success: false
    ```

    ### Child: `main.yaml` (embedded)
    Same as current `main` workflow — states like `code`, `review`, `done`, `exit`.
    When embedded, states become `run_main_workflow.code`, `run_main_workflow.review`, etc.

    ## Success Criteria
    - [ ] Embedded workflows can be loaded from external YAML files
    - [ ] States are prefixed correctly during load-time flattening
    - [ ] Child context is stored inside parent's `.raili/<parent>/context.json`
    - [ ] Variables are merged and accessible in both parent and child
    - [ ] Terminal states route via `map:` to parent states
    - [ ] Fail-fast validation catches collisions, missing files, malformed workflows
    - [ ] Resume behavior works correctly (only parent-level resumption)
    - [ ] Outputs and learnings stored with prefixed names under parent directory
    - [ ] Nested embeds are prevented (fail-fast)

    ## Acceptance Criteria
    - [ ] New `embed` state type implemented with validation in `types.ts` and schema
    - [ ] Workflow loader flattens embedded workflows into parent at load time
    - [ ] State ID prefixing with collision detection
    - [ ] `map:` routing resolver for terminal states
    - [ ] Context storage under parent (no separate child context.json)
    - [ ] Unit tests for embed loading, flattening, validation, routing
    - [ ] Integration tests for multi-state embed flows with resume scenarios
    - [ ] Documentation: `documentation/embed.md` (parallel to `groups.md`)

    ## Related Work
    - Similar to existing `groups` feature but with:
      - Independent context isolation (stored in parent)
      - Explicit terminal state routing via `map:`
      - Only parent-level resumption (no independent child resumption)

    ## Out of Scope (Future)
    - `pre_states` hooks (run before specific child states)
    - Nested embed support (depth > 1)
    - Independent child workflow resumption

